<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader — SaiVerse</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav">
      <a class="wordmark" href="index.html">SaiVerse<span>.</span></a>
      <div class="nav-links"><a class="" href="index.html">Home</a><a class="" href="genres.html">Genres</a><a class="active" href="library.html">Library</a><a class="" href="plans.html">Plans</a><a class="" href="about.html">About</a><a class="" href="contact.html">Contact</a></div>
      <a class="square-btn" href="reader.html" aria-label="Open reader">↗</a>
    </nav>
<main>
<section class="page-head"><div class="eyebrow">SaiVerse / Reader</div><h1>Open a <em>fresh page.</em></h1><p>Select a book from the library to load its title and catalogue details here.</p></section>
<section class="section"><article class="reader" id="reader"></article></section>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const params=new URLSearchParams(location.search); const q=params.get("book")||"";
 const match=books.find(b=>`${b.title} ${b.author}`.toLowerCase()===q.toLowerCase()) || books[0];
 document.title=match.title+" — SaiVerse Reader";
 document.querySelector("#reader").innerHTML=`
 <div class="reader-meta"><div class="genre">${match.genre}</div><h1>${escapeHtml(match.title)}</h1><p>by ${escapeHtml(match.author)}</p></div>
 <div class="reader-text"><p>${escapeHtml(match.description)}</p>
 <p>SaiVerse presents this title as part of its curated digital-library catalogue. This reader page is a front-end demonstration and does not reproduce copyrighted book text.</p>
 <div class="quote">A new book is a new route into an idea.</div>
 <p>Return to the library to choose another title, or explore a different genre when you are ready.</p>
 <div class="actions"><a class="btn primary" href="library.html">Back to library</a><a class="btn" href="genres.html">Browse genres</a></div></div>`;
});
</script>
</main>
<footer class="footer"><span>SAIVERSE DIGITAL LIBRARY</span><span>READ · LEARN · EXPLORE</span><span>© 2026</span></footer>
<div class="toast" id="toast"></div>
<script src="books.js"></script><script src="script.js"></script>
</body></html>
